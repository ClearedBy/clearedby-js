name: Publish (npm, with provenance)

# Manual, per-package publish with npm provenance.
# Requires an NPM_TOKEN repo/org secret (an npm automation token that can
# publish to the @clearedby scope).
on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        type: choice
        options:
          - "@clearedby/sdk"
          - "@clearedby/mcp"

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter "${{ inputs.package }}" publish --provenance --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
